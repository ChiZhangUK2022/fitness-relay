name: keepalive

on:
  schedule:
    - cron: '0 9 1 * *'   # runs at 09:00 UTC on the 1st of every month
  workflow_dispatch:        # lets you trigger it manually too

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Touch keepalive file
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-ping.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last-ping.txt
          git diff --staged --quiet || git commit -m "chore: keepalive ping"
          git push
