name: garmin-sync

on:
  repository_dispatch:
    types: [garmin-refresh]   # fired by the Worker /kick on watch events (swim done / wake)
  schedule:
    - cron: "*/20 5-9 * * *"     # every 20 min, 6-10am London (BST = UTC+1)
    - cron: "7 * * * *"          # hourly the rest of the day
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          WATCH_KEY: ${{ secrets.WATCH_KEY }}
          # Event-triggered runs wait for Garmin's cloud to catch up; scheduled runs don't.
          REFRESH_DELAY: ${{ github.event_name == 'repository_dispatch' && '90' || '0' }}
