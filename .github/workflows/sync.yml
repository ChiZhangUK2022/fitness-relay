name: garmin-sync

on:
  repository_dispatch:
    types: [garmin-refresh]   # fired by the Worker /kick on watch events (swim done / wake)
  schedule:
    - cron: "7 * * * *"          # hourly safety net all day
    - cron: "*/10 4-8 * * *"     # every 10 min during the morning-report window (UTC; ~5-9am London)
    - cron: "*/15 16-21 * * *"   # every 15 min over typical evening training hours
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          # Event-triggered runs wait for Garmin's cloud to catch up; scheduled runs don't.
          REFRESH_DELAY: ${{ github.event_name == 'repository_dispatch' && '90' || '0' }}
